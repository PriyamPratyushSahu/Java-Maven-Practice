<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doomsday Countdown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 42%, #07223d 0%, #031120 55%, #020912 100%);
      color: #ffffff;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      overflow: hidden;
    }

    .title {
      font-size: clamp(1.25rem, 2.6vw, 2.1rem);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 1.5rem;
      text-align: center;
      text-shadow: 0 0 18px rgba(0, 166, 251, 0.55);
    }

    .countdown-container {
      display: flex;
      align-items: flex-start;
      gap: clamp(0.5rem, 1.4vw, 1.2rem);
      padding: clamp(1.4rem, 2.8vw, 2.4rem) clamp(1.8rem, 3.8vw, 3.4rem);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(3, 64, 120, 0.28) 0%, rgba(2, 24, 48, 0.45) 100%);
      border: 1px solid rgba(0, 166, 251, 0.35);
      box-shadow:
        0 0 35px rgba(0, 166, 251, 0.14),
        inset 0 0 25px rgba(0, 166, 251, 0.08);
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      font-size: clamp(2.6rem, 6.2vw, 4.8rem);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-shadow:
        0 0 16px rgba(0, 166, 251, 0.65),
        0 3px 10px rgba(3, 64, 120, 0.9);
    }

    .label {
      font-size: clamp(0.58rem, 1vw, 0.82rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffffff;
      opacity: 0.92;
      margin-top: 0.75rem;
      text-shadow: 0 0 10px rgba(0, 166, 251, 0.4);
    }

    .colon {
      font-size: clamp(2.6rem, 6.2vw, 4.8rem);
      font-weight: 800;
      line-height: 0.92;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(0, 166, 251, 0.65);
    }

    #sound-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(180deg, #00a6fb 0%, #034078 58%, #012547 100%);
      color: #ffffff;
      border: 1px solid #00a6fb;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.75),
        0 0 14px rgba(0, 166, 251, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    #sound-btn:hover {
      filter: brightness(1.15);
    }

    #sound-btn:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <div class="title">DOOMSDAY IS COMING</div>

  <div class="countdown-container">
    <div class="time-block">
      <div class="number" id="months">00</div>
      <div class="label">MONTHS</div>
    </div>
    <div class="colon">:</div>
    <div class="time-block">
      <div class="number" id="days">00</div>
      <div class="label">DAYS</div>
    </div>
    <div class="colon">:</div>
    <div class="time-block">
      <div class="number" id="hours">00</div>
      <div class="label">HOURS</div>
    </div>
    <div class="colon">:</div>
    <div class="time-block">
      <div class="number" id="minutes">00</div>
      <div class="label">MINUTES</div>
    </div>
    <div class="colon">:</div>
    <div class="time-block">
      <div class="number" id="seconds">00</div>
      <div class="label">SECONDS</div>
    </div>
  </div>

  <button id="sound-btn">Enable Tick Audio</button>

  <script>
    // ==========================================
    // 1. SET YOUR TARGET DATE & TIME HERE
    // ==========================================
    const targetDate = new Date("2026-12-18T00:00:00");

    // ==========================================
    // 2. AUDIO FILE PLAYER (TICK SOUND)
    // ==========================================
    const tickAudio = new Audio("tick.mp3");
    tickAudio.loop = true; // Repeats the full file seamlessly

    let soundEnabled = false;
    const soundBtn = document.getElementById("sound-btn");

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "Mute Tick Audio" : "Enable Tick Audio";

      if (soundEnabled) {
        tickAudio.play().catch(() => {});
      } else {
        tickAudio.pause();
      }
    });

    function playTick() {
      // Leave empty since tickAudio is looping automatically
    }

    
    // ==========================================
    // 3. COUNTDOWN CALCULATION LOGIC
    // ==========================================
    let lastSecond = -1;

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function updateCountdown() {
      const now = new Date();

      if (now >= targetDate) {
        document.getElementById("months").textContent = "00";
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        return;
      }

      let months = (targetDate.getFullYear() - now.getFullYear()) * 12 + (targetDate.getMonth() - now.getMonth());
      let tempDate = new Date(now.getTime());
      tempDate.setMonth(tempDate.getMonth() + months);

      if (tempDate > targetDate) {
        months--;
        tempDate = new Date(now.getTime());
        tempDate.setMonth(tempDate.getMonth() + months);
      }

      let diffMs = targetDate - tempDate;

      const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      diffMs -= days * (1000 * 60 * 60 * 24);

      const hours = Math.floor(diffMs / (1000 * 60 * 60));
      diffMs -= hours * (1000 * 60 * 60);

      const minutes = Math.floor(diffMs / (1000 * 60));
      diffMs -= minutes * (1000 * 60);

      const seconds = Math.floor(diffMs / 1000);

      document.getElementById("months").textContent = pad(months);
      document.getElementById("days").textContent = pad(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);

      if (seconds !== lastSecond) {
        if (lastSecond !== -1) {
          playTick();
        }
        lastSecond = seconds;
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 100);
  </script>
</body>
</html>
