<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Full-Screen Ring Timer with Ripples</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
          height: 100vh;
          background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }

        .timer-container {
          position: relative;
          width: 98vmin;
          height: 98vmin;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        /* SVG Ring Styling */
        .progress-ring {
          position: absolute;
          width: 100%;
          height: 100%;
          transform: rotate(-90deg);
          /* overflow: visible ensures ripples can expand beyond the bounding box */
          overflow: visible;
        }

        .progress-ring__bg {
          fill: none;
          stroke: #161618;
          stroke-width: 16;
        }

        .progress-ring__circle {
          fill: none;
          stroke: #00e5ff;
          stroke-width: 16;
          stroke-linecap: round;
          transition: stroke-dashoffset 0.3s linear;
          filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.7));
          /* Keeps the main ring above the ripples */
          position: relative;
          z-index: 10;
        }

        /* ========================================= */
        /* RIPPLE EFFECTS (Water Drip Waves)         */
        /* ========================================= */
        .ripple-circle {
          fill: none;
          transform-origin: 250px 250px; /* Center of the SVG viewBox */
        }

        /* Subtle wave every second */
        .ripple-second {
          stroke: #00e5ff;
          stroke-width: 4;
          animation: ripple-anim-second 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Brighter, slightly larger wave every minute */
        .ripple-minute {
          stroke: #ffffff;
          stroke-width: 8;
          filter: drop-shadow(0 0 10px #ffffff);
          animation: ripple-anim-minute 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Massive glowing wave every hour */
        .ripple-hour {
          stroke: #00e5ff;
          stroke-width: 16;
          filter: drop-shadow(0 0 20px #00e5ff);
          animation: ripple-anim-hour 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes ripple-anim-second {
          0%   { transform: scale(1); opacity: 0.6; }
          100% { transform: scale(1.3); opacity: 0; }
        }

        @keyframes ripple-anim-minute {
          0%   { transform: scale(1); opacity: 0.8; }
          100% { transform: scale(1.6); opacity: 0; }
        }

        @keyframes ripple-anim-hour {
          0%   { transform: scale(1); opacity: 1; }
          100% { transform: scale(2.0); opacity: 0; }
        }
        /* ========================================= */

        /* Central Content Area */
        .center-content {
          position: absolute;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          width: 100%;
          z-index: 20; /* Keeps text above ripples */
        }

        /* Main Countdown Timer */
        .countdown-time {
          color: #ffffff;
          font-size: 18vmin;
          font-weight: 800;
          letter-spacing: -2px;
          line-height: 1;
        }

        /* Target Display Label */
        .target-label {
          color: rgba(255, 255, 255, 0.6); /* Slightly brightened to match new background */
          font-size: 4vmin;
          font-weight: 500;
          margin-top: 20px;
          letter-spacing: 2px;
          text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="timer-container">
    <svg class="progress-ring" viewBox="0 0 500 500">
        <circle class="progress-ring__bg" cx="250" cy="250" r="230" />
        <circle class="progress-ring__circle" id="progressCircle" cx="250" cy="250" r="230" />
    </svg>

    <div class="center-content">
        <div class="countdown-time" id="timerDisplay">00:00:00</div>
        <div class="target-label" id="targetDisplay">TARGET: --:--</div>
    </div>
</div>

<script>
    // ========================================================
    // 1. INPUT TARGET TIME HERE (24-Hour Format -> HH:MM:SS)
    // ========================================================
    const DAILY_TARGET_TIME = "20:45:00";

    const circle = document.getElementById('progressCircle');
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;

    circle.style.strokeDasharray = `${circumference} ${circumference}`;
    circle.style.strokeDashoffset = circumference;

    function formatTo12Hour(timeStr) {
        const [hh, mm] = timeStr.split(':');
        let hours = parseInt(hh, 10);
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${hours}:${mm} ${ampm}`;
    }

    document.getElementById('targetDisplay').innerText = `Target: ${formatTo12Hour(DAILY_TARGET_TIME)}`;

    function setCircleProgress(percent) {
        const offset = circumference - (percent / 100) * circumference;
        circle.style.strokeDashoffset = offset;
    }

    // Ripple Element Generator
    function triggerRipple(type) {
        const svg = document.querySelector('.progress-ring');
        // Create an SVG circle dynamically
        const ripple = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        ripple.setAttribute('cx', '250');
        ripple.setAttribute('cy', '250');
        ripple.setAttribute('r', '230'); // Start at exact size of main ring
        ripple.classList.add('ripple-circle', `ripple-${type}`);

        // Insert behind the main glowing ring
        svg.insertBefore(ripple, svg.firstChild);

        // Remove from DOM after animation completes to save memory
        const duration = type === 'hour' ? 3000 : (type === 'minute' ? 2000 : 1000);
        setTimeout(() => {
            if (ripple.parentNode) {
                ripple.parentNode.removeChild(ripple);
            }
        }, duration);
    }

    // Tracking variables to detect changes
    let prevSeconds = null;
    let prevMinutes = null;
    let prevHours = null;

    function updateTimer() {
        const now = new Date();
        const [targetHours, targetMinutes, targetSeconds] = DAILY_TARGET_TIME.split(':').map(Number);

        let targetDate = new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate(),
            targetHours,
            targetMinutes || 0,
            targetSeconds || 0
        );

        if (now >= targetDate) {
            targetDate.setDate(targetDate.getDate() + 1);
        }

        const diffInMs = targetDate - now;

        const hours = Math.floor(diffInMs / (1000 * 60 * 60));
        const minutes = Math.floor((diffInMs % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diffInMs % (1000 * 60)) / 1000);

        // Render UI
        document.getElementById('timerDisplay').innerText =
            String(hours).padStart(2, '0') + ":" +
            String(minutes).padStart(2, '0') + ":" +
            String(seconds).padStart(2, '0');

        const totalDayMs = 24 * 60 * 60 * 1000;
        const percentRemaining = (diffInMs / totalDayMs) * 100;
        setCircleProgress(percentRemaining);

        // RIPPLE LOGIC: Compare current time units to previous ones
        if (prevSeconds !== null) {
            if (seconds !== prevSeconds) triggerRipple('second');
            if (minutes !== prevMinutes) triggerRipple('minute');
            if (hours !== prevHours)     triggerRipple('hour');
        }

        // Update tracking variables
        prevSeconds = seconds;
        prevMinutes = minutes;
        prevHours = hours;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
